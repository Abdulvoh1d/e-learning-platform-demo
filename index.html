<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1e8">
  <meta name="description" content="A friendly, local-first sample course library demo.">
  <title>Learnwell — Course library</title>
  <link rel="stylesheet" href="styles.css">
